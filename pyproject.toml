[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv"]

[tool.ruff.lint]
# Conjunto mínimo: erros de sintaxe/pyflakes e subconjunto de pycodestyle.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# main.py ajusta sys.path antes dos imports de propósito.
"main.py" = ["E402"]
